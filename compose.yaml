services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobhunterai
      POSTGRES_USER: jobhunterai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunterai -d jobhunterai"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: JobHunterAI.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__JobHunterAI: Host=db;Port=5432;Database=jobhunterai;Username=jobhunterai;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: JobHunterAI.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/
    ports:
      - "8082:8080"
    depends_on:
      - api

volumes:
  postgres-data:
