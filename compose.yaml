services:
  api:
    build:
      context: .
      dockerfile: JobHunterAI.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8081:8080"
  web:
    build:
      context: .
      dockerfile: JobHunterAI.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/
    ports:
      - "8082:8080"
    depends_on:
      - api
