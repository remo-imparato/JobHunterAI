services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobhunterai
      POSTGRES_USER: jobhunterai
      POSTGRES_PASSWORD: jobhunterai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunterai -d jobhunterai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: JobHunterAI.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__JobHunterAI: "Host=db;Port=5432;Database=jobhunterai;Username=jobhunterai;Password=jobhunterai;GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "true"
      Database__SeedDevelopmentData: "false"
      Background__Enabled: "${BACKGROUND_ENABLED:-true}"
      Background__EnableSearchPipeline: "${BACKGROUND_ENABLE_SEARCH_PIPELINE:-true}"
      Background__EnableAiJobs: "${BACKGROUND_ENABLE_AI_JOBS:-true}"
      Background__LogDirectory: /app/logs
      Discovery__JobsPerBoard: "${DISCOVERY_JOBS_PER_SOURCE:-300}"
      PublicFeeds__MaxPages: "${ARBEITNOW_MAX_PAGES:-3}"
      AI__Endpoint: ${AI_ENDPOINT:-}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__DeploymentName: ${AI_DEPLOYMENT_NAME:-}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - jobhunter-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build:
      context: .
      dockerfile: JobHunterAI.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  jobhunter-logs:

